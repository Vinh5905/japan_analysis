version: 2

sources:
    - name: warehouse_raw
      schema: raw
      tables:
          - name: mlit_datasets
            description: "Content-addressed city-scoped MLIT releases; loader-owned immutable raw."
          - name: mlit_zoning_polygons
            description: "Original feature geometry/properties; no geometry repair."
          - name: suumo_building_locations
            description: "Loader-owned building POI cache. Exact name/chome/house-number matching; not independent rooftop verification."
          - name: suumo_building_name_backfill
            description: "Snapshot-verified building headline enrichment; preserves original observation timestamps and hashes."
          - name: suumo_address_geocodes
            description: "Loader-owned GSI cache by provider, query version and chome address. Accepted points represent addresses, not individual buildings."
          - name: suumo_parser_records
            columns:
                - name: task_id
                  data_tests:
                      - not_null
                      - unique
                - name: batch_id
                  data_tests:
                      - not_null
                - name: data_hash
                  data_tests:
                      - not_null

    - name: zoning_operations
      schema: enrichment
      tables:
          - name: zoning_runs
          - name: zoning_run_inputs
          - name: zoning_run_tasks
          - name: zoning_publication_pointer
          - name: zoning_publication_audit
