version: 2

seeds:
  - name: suumo_parser_records_seed
    description: >
      Local bootstrap copy of the 17,927-row notebook raw snapshot. It is
      loaded into the raw schema and never replaces operational raw records
      with the same task_id.
    config:
      tags: [suumo_notebook_seed]
    columns:
      - name: task_id
        data_tests:
          - not_null
          - unique
      - name: source_id
        data_tests:
          - not_null
      - name: data_hash
        data_tests:
          - not_null
      - name: parsed_at
        data_tests:
          - not_null
