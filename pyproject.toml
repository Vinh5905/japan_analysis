[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py310"
extend-exclude = [".agents", "pipeline/vendor", "notebook", "tmp"]

[tool.ruff.lint]
# Formatting only: do not introduce unrelated lint/refactoring changes.
select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.sqlfmt]
line_length = 88
exclude = ["analytics/dbt/target/**/*", "analytics/dbt/dbt_packages/**/*"]
